[package]
name = "catflix"
version = "0.1.0"
description = "Catflix — a clean, ad-free desktop player for frameXTV"
edition = "2021"
rust-version = "1.77"

[lib]
name = "catflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
