<!doctype html>
<!--
  Catflix for LG webOS: opens Catflix's own site in its television layout. The address is written
  in by `scripts/webos.mjs` from the settings, so it is never part of the repository.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Catflix</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #09080f;
        color: #f4f2fa;
        font-family: sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      img {
        width: 50vw;
      }
      p {
        position: fixed;
        bottom: 8vh;
        width: 100%;
        margin: 0;
        text-align: center;
        font-size: 2.2vh;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <img src="splash.png" alt="Catflix" />
    <p id="status">Opening Catflix…</p>
    <script>
      var site = "__CATFLIX_SITE__";
      var open = function () {
        location.replace(site + "/?tv=1");
      };
      // Offline: say so and try again by itself once the network is back.
      if (navigator.onLine === false) {
        document.getElementById("status").textContent =
          "Catflix could not reach its catalogue. Check the TV's network connection.";
        window.addEventListener("online", open);
      } else {
        open();
      }
    </script>
  </body>
</html>
