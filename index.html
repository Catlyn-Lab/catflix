<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09080f" />
    <meta name="color-scheme" content="dark" />
    <title>Catflix</title>
    <meta
      name="description"
      content="Catflix: films, series, anime and Asian drama in one ad-free app, with subtitles in your language."
    />

    <!-- Icons. New file names so browsers that cached the earlier icons fetch these. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews. `__SITE__` is the site's own address, filled in by Catflix's server. -->
    <link rel="canonical" href="__SITE__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Catflix" />
    <meta property="og:title" content="Catflix" />
    <meta
      property="og:description"
      content="Films, series, anime and Asian drama in one ad-free app, with subtitles in your language."
    />
    <meta property="og:url" content="__SITE__/" />
    <meta property="og:image" content="__SITE__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Catflix" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Catflix" />
    <meta
      name="twitter:description"
      content="Films, series, anime and Asian drama in one ad-free app, with subtitles in your language."
    />
    <meta name="twitter:image" content="__SITE__/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
