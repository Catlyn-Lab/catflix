name: Release build

# A pull request into `release` builds the installers for macOS, Windows and Linux and attaches
# them to the run, so they can be tried before merging. Merging it (a push to `release`) builds
# them again and puts them on a draft GitHub release tagged with the app version.
on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # The catalogue hosts and the backend URL are build settings kept out of the repository:
      # the CATFLIX_ENV secret holds the VITE_* lines of .env (see .env.example).
      - name: Write .env
        shell: bash
        env:
          CATFLIX_ENV: ${{ secrets.CATFLIX_ENV }}
        run: |
          if [ -z "$CATFLIX_ENV" ]; then echo "::error::Add the CATFLIX_ENV secret (see .env.example)"; exit 1; fi
          printf '%s\n' "$CATFLIX_ENV" > .env

      - name: Build installers
        if: github.event_name != 'push'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - name: Build installers and add them to the draft release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Catflix v__VERSION__
          releaseBody: Installers for macOS, Windows and Linux are attached below.
          releaseDraft: true
          prerelease: false

      - name: Attach installers to this run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: catflix-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
